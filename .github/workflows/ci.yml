name: Mozart 2 CI (Linux & Windows)

on:
  push:
    branches: [ master, upgrade-cpp20 ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # Stratégie matricielle : lance les jobs en parallèle sur Linux et Windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configuration de Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    # ==========================================
    # LINUX
    # ==========================================
    - name: Installation des dépendances (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libboost-all-dev tcl-dev tk-dev emacs

    - name: Configuration CMake (Linux)
      if: runner.os == 'Linux'
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"


    # ==========================================
    # WINDOWS
    # ==========================================
    - name: Installation de Tcl/Tk (Windows)
      if: runner.os == 'Windows'
      run: choco install magicsplat-tcl-tk --no-progress -y

    - name: Installation de Boost (Windows)
      if: runner.os == 'Windows'
      uses: MarkusJx/install-boost@v2
      id: install-boost
      with:
        boost_version: 1.83.0

    - name: Configuration CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DBOOST_ROOT="${{ steps.install-boost.outputs.BOOST_ROOT }}"


    # ==========================================
    # COMPILATION ET TESTS COMMUNS
    # ==========================================
    - name: Compilation de Mozart 2
      run: cmake --build build --config Release --parallel 4

    - name: Génération des tests (vmtest & platform-test)
      run: |
        cmake --build build --target vmtest --config Release
        cmake --build build --target platform-test --config Release

    - name: Exécution de CTest
      working-directory: ./build
      run: ctest --output-on-failure -C Release