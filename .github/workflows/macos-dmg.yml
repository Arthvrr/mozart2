name: Build macOS DMG (ARM64)

on:
  push:
    branches: [ app-installer ] # S'exécute uniquement sur ta nouvelle branche

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configuration de Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Installation des dépendances (Homebrew)
      # AJOUT : "boost" est désormais installé pour éviter le crash de CMake
      run: |
        brew update
        brew install emacs tcl-tk@8 boost

    - name: Configuration CMake
      # Sur Apple Silicon, Homebrew installe les paquets dans /opt/homebrew/
      run: >
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        -DTCL_LIBRARY="/opt/homebrew/opt/tcl-tk@8/lib/libtcl8.6.dylib" 
        -DTK_LIBRARY="/opt/homebrew/opt/tcl-tk@8/lib/libtk8.6.dylib" 
        -DTCL_INCLUDE_PATH="/opt/homebrew/opt/tcl-tk@8/include" 
        -DTK_INCLUDE_PATH="/opt/homebrew/opt/tcl-tk@8/include"

    - name: Compilation de Mozart 2
      run: cmake --build build --config Release --parallel 4

    - name: Création du fichier DMG
      working-directory: ./build
      run: cpack -G DragNDrop

    - name: Mise à disposition du DMG pour le téléchargement
      # AJOUT : Cette étape récupère le fichier DMG généré et te permet de le télécharger depuis GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Mozart2-macOS-ARM64-App
        path: ./build/*.dmg
        if-no-files-found: error