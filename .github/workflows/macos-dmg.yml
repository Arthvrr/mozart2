name: Build macOS DMG (ARM64 Natif)

on:
  push:
    branches: [ app-installer ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configuration de Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Installation des dépendances (Homebrew)
      run: |
        brew update
        brew install emacs tcl-tk@8 boost

    - name: Configuration CMake (ARM64)
      run: >
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" 
        "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-stack_size,0x20000000" 
        -DTCL_LIBRARY="/opt/homebrew/opt/tcl-tk@8/lib/libtcl8.6.dylib" 
        -DTK_LIBRARY="/opt/homebrew/opt/tcl-tk@8/lib/libtk8.6.dylib" 
        -DTCL_INCLUDE_PATH="/opt/homebrew/opt/tcl-tk@8/include" 
        -DTK_INCLUDE_PATH="/opt/homebrew/opt/tcl-tk@8/include"

    - name: Compilation de Mozart 2 (Mode Force Brute)
      # La boucle "until" relance la compilation automatiquement en cas de Segfault
      # jusqu'à ce que le compilateur atteigne les 100 % !
      run: |
        until cmake --build build --config Release --parallel 1; do
          echo "Crash aléatoire du runner détecté. Reprise immédiate de la compilation..."
        done

    - name: Création du fichier DMG (Générateur Bundle)
      working-directory: ./build
      run: cpack -G Bundle

    - name: Mise à disposition du DMG
      uses: actions/upload-artifact@v4
      with:
        name: Mozart2-macOS-ARM64-App
        path: ./build/*.dmg
        if-no-files-found: error