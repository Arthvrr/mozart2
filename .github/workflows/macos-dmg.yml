name: Build macOS DMG (ARM64 Natif)

on:
  push:
    branches: [ app-installer ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configuration de Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Installation des dépendances (Homebrew)
      run: |
        brew update
        brew install emacs tcl-tk@8 boost

    - name: Configuration CMake (ARM64)
      run: >
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" 
        "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-stack_size,0x20000000" 
        -DTCL_LIBRARY="/opt/homebrew/opt/tcl-tk@8/lib/libtcl8.6.dylib" 
        -DTK_LIBRARY="/opt/homebrew/opt/tcl-tk@8/lib/libtk8.6.dylib" 
        -DTCL_INCLUDE_PATH="/opt/homebrew/opt/tcl-tk@8/include" 
        -DTK_INCLUDE_PATH="/opt/homebrew/opt/tcl-tk@8/include"

    - name: Compilation de Mozart 2 (Mode Force Brute)
      # La boucle "until" relance la compilation automatiquement en cas de Segfault
      # jusqu'à ce que le compilateur atteigne les 100 % !
      run: |
        until cmake --build build --config Release --parallel 1; do
          echo "Crash aléatoire du runner détecté. Reprise immédiate de la compilation..."
        done

    - name: Assemblage manuel de Mozart2.app
      run: |
        # 1. On extrait les fichiers compilés dans un dossier temporaire
        cmake --install build --prefix ./raw_install
        
        # 2. On crée l'architecture stricte d'une application macOS
        mkdir -p Mozart2.app/Contents/MacOS
        mkdir -p Mozart2.app/Contents/Resources
        
        # 3. On copie le "cerveau" de l'application (tes fichiers macos/)
        cp macos/Info.plist Mozart2.app/Contents/
        cp macos/startup Mozart2.app/Contents/MacOS/Mozart2
        chmod +x Mozart2.app/Contents/MacOS/Mozart2
        
        # 4. On copie l'icône (si elle est dans le dossier macos)
        cp macos/*.icns Mozart2.app/Contents/Resources/ || true
        
        # 5. On range le moteur de Mozart dans les ressources de l'app
        mv ./raw_install/bin Mozart2.app/Contents/Resources/
        mv ./raw_install/share Mozart2.app/Contents/Resources/

    - name: Création du fichier DMG natif (Outil Apple)
      run: |
        # Utilisation de l'outil officiel macOS pour créer une image disque parfaite
        hdiutil create -volname "Mozart 2" -srcfolder Mozart2.app -ov -format UDZO Mozart2-ARM64.dmg

    - name: Mise à disposition du DMG
      uses: actions/upload-artifact@v4
      with:
        name: Mozart2-macOS-ARM64-App
        path: ./Mozart2-ARM64.dmg
        if-no-files-found: error